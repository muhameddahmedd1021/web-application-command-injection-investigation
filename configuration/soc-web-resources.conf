ServerName soc-web.lab
<IfModule mpm_prefork_module>
StartServers 2
MinSpareServers 1
MaxSpareServers 2
MaxRequestWorkers 6
MaxConnectionsPerChild 500
</IfModule>
LogFormat "{\"timestamp\":\"%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}tZ\",\"vhost\":\"%v:%{local}p\",\"client_ip\":\"%a\",\"request_id\":\"%{UNIQUE_ID}e\",\"forwarded_request_id\":\"%{X-SOC-Request-ID}i\",\"method\":\"%m\",\"path\":\"%U\",\"status\":%>s,\"response_bytes\":%B,\"pid\":%P,\"duration_us\":%D}" socweb
