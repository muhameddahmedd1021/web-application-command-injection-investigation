<VirtualHost 192.168.144.20:8080>
    ServerName soc-web.lab
    SecRuleEngine DetectionOnly
    SecAuditEngine Off
    SecAuditLogParts ABCFHKZ
    SecAction "id:100010,phase:1,pass,nolog,sanitiseRequestHeader:Cookie,sanitiseRequestHeader:Authorization"
    SecAction "id:100011,phase:3,pass,nolog,sanitiseResponseHeader:Set-Cookie"
    SecRule REQUEST_URI "@beginsWith /vulnerabilities/exec/" "id:100012,phase:1,pass,nolog,ctl:auditEngine=On"
    RequestHeader unset Accept-Encoding
    RequestHeader unset X-SOC-Request-ID
    RequestHeader set X-SOC-Request-ID "%{UNIQUE_ID}e"
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/
    ErrorLog /opt/soc-web-lab/logs/waf-error.log
    CustomLog /opt/soc-web-lab/logs/waf-access.jsonl socweb
</VirtualHost>
<VirtualHost 127.0.0.1:8081>
    ServerName dvwa-backend.lab
    SecRuleEngine Off
    SecAuditEngine Off
    DocumentRoot /var/www/soc-dvwa
    <FilesMatch "\.(bak|sql|dist)$">
        Require all denied
    </FilesMatch>
    <Directory /var/www/soc-dvwa>
        Require local
        AllowOverride None
        Options -Indexes
    </Directory>
    ErrorLog /opt/soc-web-lab/logs/backend-error.log
    CustomLog /opt/soc-web-lab/logs/backend-access.jsonl socweb
</VirtualHost>
