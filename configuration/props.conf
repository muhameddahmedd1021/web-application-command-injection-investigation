[soc:web:waf]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
KV_MODE = json
TIME_PREFIX = "time":\s*"
TIME_FORMAT = %d/%b/%Y:%H:%M:%S.%6N %z
MAX_TIMESTAMP_LOOKAHEAD = 40
[soc:web:access]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
[soc:web:backend]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
[soc:web:process]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
TIME_PREFIX = "timestamp":\s*
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 24
[soc:web:proxy]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "timestamp":
TIME_FORMAT = %s.%3N
